<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Offline | Wasilah AI</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <meta name="theme-color" content="#0f766e">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #f0fdfa 0%, #e6fffa 100%);
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }
        .card {
            background: #ffffff;
            border-radius: 24px;
            padding: 40px 32px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 40px -15px rgba(15, 118, 110, 0.15), 0 0 0 1px rgba(15, 118, 110, 0.08);
        }
        .icon-wrap {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            position: relative;
        }
        .icon-wrap svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 8px 16px rgba(15, 118, 110, 0.25));
        }
        .offline-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #fee2e2;
            color: #b91c1c;
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 16px;
        }
        .offline-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef4444;
        }
        h1 {
            font-size: 22px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 8px;
        }
        p {
            font-size: 14px;
            line-height: 1.6;
            color: #64748b;
            margin-bottom: 28px;
        }
        .btn-retry {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background: linear-gradient(135deg, #0f766e 0%, #059669 100%);
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            padding: 14px 20px;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 10px 20px -5px rgba(5, 150, 105, 0.35);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .btn-retry:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 24px -5px rgba(5, 150, 105, 0.45);
        }
        .btn-retry:active {
            transform: translateY(1px);
        }
        .footer-note {
            margin-top: 24px;
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-wrap">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
                <defs>
                    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#0f766e" />
                        <stop offset="100%" stop-color="#059669" />
                    </linearGradient>
                </defs>
                <rect width="100" height="100" rx="28" fill="url(#g)" />
                <path d="M55 16L24 55h24l-7 29 35-39H50l5-29z" fill="#fcd34d" stroke="#f59e0b" stroke-width="2" />
            </svg>
        </div>
        <div class="offline-badge">
            <span class="offline-dot"></span>
            Mode Offline
        </div>
        <h1>Koneksi Terputus</h1>
        <p>Aplikasi Wasilah AI membutuhkan koneksi internet untuk memuat data percakapan real-time. Periksa koneksi WiFi atau paket data Anda.</p>
        <button class="btn-retry" onclick="window.location.reload()">
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
            Coba Hubungkan Ulang
        </button>
        <div class="footer-note">
            Wasilah AI Omnichannel CRM &bull; PWA
        </div>
    </div>
</body>
</html>
